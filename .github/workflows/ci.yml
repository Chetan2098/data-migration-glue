name: CI/CD (CloudFormation deploy)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate + Unit Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml boto3 faker openpyxl

      - name: Smoke run generator + mapping sheet
        run: |
          python Scripts/synthetic_csv_genrator.py
          python Scripts/data_mapping_sheet.py

      - name: Validate CloudFormation templates
        run: |
          aws cloudformation validate-template --template-body file://cf_templates/glue-crawler.yaml
          aws cloudformation validate-template --template-body file://cf_templates/s3_datalakes.yml

  deploy:
    name: Deploy CloudFormation (main only)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions

      - name: Deploy S3 Data Lake stack
        run: |
          aws cloudformation deploy \
            --template-file cf_templates/s3_datalakes.yml \
            --stack-name data-migration-datalake \
            --capabilities CAPABILITY_NAMED_IAM

      - name: Deploy Glue Crawler stack
        run: |
          aws cloudformation deploy \
            --template-file cf_templates/glue-crawler.yaml \
            --stack-name data-migration-glue-crawler \
            --capabilities CAPABILITY_NAMED_IAM
