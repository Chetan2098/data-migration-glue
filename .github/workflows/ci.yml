name: CI/CD (CloudFormation deploy)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate CloudFormation
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate CloudFormation templates
        run: |
          aws cloudformation validate-template --template-body file://cf_templates/glue-crawler.yaml
          aws cloudformation validate-template --template-body file://cf_templates/setup.yml

  approval:
    name: Wait for deployment approval
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
    steps:
      - name: Await environment approval
        run: echo "Deployment approved via environment protection."

  deploy:
    name: Deploy CloudFormation (main only)
    runs-on: ubuntu-latest
    needs: approval
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy S3 Data Lake stack
        run: |
          aws cloudformation deploy \
            --template-file cf_templates/setup.yml \
            --stack-name data-migration-datalake \
            --capabilities CAPABILITY_NAMED_IAM

      - name: Deploy Glue Crawler stack
        run: |
          aws cloudformation deploy \
            --template-file cf_templates/glue-crawler.yml \
            --stack-name data-migration-glue-crawler \
            --capabilities CAPABILITY_NAMED_IAM
